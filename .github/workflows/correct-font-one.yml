name: Correct custom font numeral one
on:
  push:
    paths:
      - '.github/workflows/correct-font-one.yml'
permissions:
  contents: write
jobs:
  build-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install font tooling
        run: python -m pip install 'fonttools>=4.50,<5'
      - name: Replace glyph and verify unchanged digits
        run: python tools/patch_digit_one.py
      - name: Commit corrected deployable font files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/VectoredAeroWide-Bold.otf fonts/VectoredAero-Regular.otf
          git add fonts/VectoredAeroWide-Bold.ttf fonts/VectoredAero-Regular.ttf
          if ! git diff --cached --quiet; then
            git commit -m "Replace numeral 1 with legible upright design in Vectored Aero fonts"
            git pull --rebase origin main
            git push origin main
          fi
