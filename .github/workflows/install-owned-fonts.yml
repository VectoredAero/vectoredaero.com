name: Install owned site fonts
on:
  push:
    paths:
      - '.github/workflows/install-owned-fonts.yml'
permissions:
  contents: write
jobs:
  extract-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract Vectored Aero font binaries from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts
          unzip -p 'Vectored Aero Fonts copy.zip' '*/Fonts/VectoredAeroWide-Bold.otf' > fonts/VectoredAeroWide-Bold.otf
          unzip -p 'Vectored Aero Fonts copy.zip' '*/Fonts/VectoredAero-Regular.otf' > fonts/VectoredAero-Regular.otf
          test -s fonts/VectoredAeroWide-Bold.otf
          test -s fonts/VectoredAero-Regular.otf
      - name: Commit extracted fonts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/VectoredAeroWide-Bold.otf fonts/VectoredAero-Regular.otf
          if ! git diff --cached --quiet; then
            git commit -m "Install custom Vectored Aero website fonts"
            git push
          fi
